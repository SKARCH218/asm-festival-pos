<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주문 접수</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface@latest/dist/tossface.css">
  <style>body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Tossface",sans-serif}</style>
</head>
<body class="bg-slate-100 h-screen flex flex-col select-none">
  <header class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button id="openLog" aria-label="주문 내역 열기" class="w-11 h-11 rounded-xl bg-white/20 text-2xl leading-none">☰</button>
      <h1 class="text-xl font-bold">🧾 <span id="title"></span> 주문 접수</h1>
    </div>
    <div class="flex items-center gap-4">
      <button id="editMode" class="px-3 py-2 rounded-xl bg-white/20 text-sm">✏️ 메뉴 편집</button>
      <div class="text-right"><div class="text-xs opacity-80">오늘 총 매출</div><div id="sales" class="text-xl font-bold">0원</div></div>
    </div>
  </header>
  <main class="flex-1 min-h-0 flex flex-col md:flex-row">
    <section class="flex-1 overflow-y-auto p-3">
      <div id="menus" class="grid grid-cols-2 lg:grid-cols-3 gap-3"></div>
      <p id="empty" class="hidden text-center text-slate-500 mt-10">등록된 메뉴가 없어요. 아래 + 칸을 눌러 메뉴를 추가하세요.</p>
    </section>
    <aside class="md:w-96 bg-white border-t md:border-t-0 md:border-l flex flex-col max-h-[45vh] md:max-h-none">
      <h2 class="px-4 pt-3 font-bold text-lg">장바구니</h2>
      <ul id="cart" class="flex-1 overflow-y-auto px-4 divide-y"></ul>
      <div class="p-4 border-t space-y-2">
        <input id="buyer" maxlength="20" placeholder="주문자 이름" class="w-full border rounded-xl px-4 py-3 text-lg select-text">
        <div class="flex justify-between text-2xl font-bold"><span>합계</span><span id="total">0원</span></div>
        <div class="flex gap-2">
          <button id="clear" class="px-4 py-4 rounded-xl bg-slate-200 text-lg">비우기</button>
          <button id="pay" class="flex-1 py-4 rounded-xl bg-blue-600 text-white text-xl font-bold disabled:opacity-40" disabled>결제 완료</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="addBg" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
    <form id="addForm" class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3">
      <h2 class="text-xl font-bold">➕ 메뉴 추가</h2>
      <input id="mName" required maxlength="20" placeholder="메뉴 이름" class="w-full border rounded-xl px-4 py-3 text-lg select-text">
      <input id="mPrice" required type="number" min="0" step="100" inputmode="numeric" placeholder="가격(원)" class="w-full border rounded-xl px-4 py-3 text-lg select-text">
      <div class="flex gap-2">
        <button type="button" id="addCancel" class="px-4 py-3 rounded-xl bg-slate-200 text-lg">취소</button>
        <button class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-lg font-bold">추가</button>
      </div>
    </form>
  </div>

  <div id="logBg" class="hidden fixed inset-0 bg-black/40 z-40"></div>
  <aside id="log" class="fixed top-0 left-0 h-full w-full max-w-sm bg-slate-800 text-white z-50 flex flex-col -translate-x-full transition-transform duration-200">
    <div class="px-4 py-3 bg-orange-500 flex justify-between items-center">
      <h2 class="text-lg font-bold">🍳 주문 내역 <span id="logCount" class="text-sm font-normal"></span></h2>
      <button id="closeLog" aria-label="닫기" class="w-10 h-10 rounded-lg bg-white/20 text-xl">✕</button>
    </div>
    <div class="p-3 bg-slate-800 border-b border-slate-700">
      <input id="logSearch" type="search" placeholder="🔍 주문자 이름 검색" class="w-full rounded-xl px-4 py-2 bg-slate-700 text-white placeholder-slate-400 select-text outline-none focus:ring-2 focus:ring-orange-400">
    </div>
    <div id="logList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
  </aside>

  <script type="module">
    import { getClass, classRefs, ensureClass, onSnapshot, doc, addDoc, updateDoc, deleteDoc, runTransaction, completeOrder, cancelOrder, deleteOrder, congestionRef, won, esc, toast, db } from "/common.js";
    const { id, label } = getClass();
    const { classRef, menusCol, ordersCol } = classRefs(id);
    document.getElementById("title").textContent = label;
    ensureClass(id, label);

    let menus = [];
    const cart = new Map(); // menuId -> qty
    let editing = false;
    const $ = (s) => document.getElementById(s);

    onSnapshot(classRef, (s) => ($("sales").textContent = won(s.data()?.totalSales)));
    onSnapshot(menusCol, (snap) => {
      menus = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      // 품절/삭제된 메뉴는 장바구니에서 제거
      for (const mid of [...cart.keys()]) {
        const m = menus.find((x) => x.id === mid);
        if (!m || m.soldOut) cart.delete(mid);
      }
      render();
    });

    function render() {
      $("empty").classList.toggle("hidden", menus.length > 0);
      const tile = (m) => editing ? `
        <div class="min-h-[11rem] flex flex-col rounded-2xl p-3 shadow bg-white ring-2 ring-blue-200 ${m.soldOut ? "opacity-70" : ""}">
          <div class="text-2xl font-bold leading-tight ${m.soldOut ? "line-through text-slate-400" : ""}">${esc(m.name)}</div>
          <div class="mt-auto text-blue-600 text-2xl font-extrabold">${won(m.price)}</div>
          <div class="mt-2 flex gap-1 text-sm">
            <button data-sold="${m.id}" data-v="${!m.soldOut}" class="flex-1 py-2 rounded-lg ${m.soldOut ? "bg-red-600 text-white" : "bg-slate-200"}">${m.soldOut ? "품절 해제" : "품절"}</button>
            <button data-price="${m.id}" data-p="${m.price}" class="px-3 py-2 rounded-lg bg-slate-200">가격</button>
            <button data-del="${m.id}" data-n="${esc(m.name)}" class="px-3 py-2 rounded-lg bg-slate-200">🗑</button>
          </div>
        </div>` : `
        <button data-id="${m.id}" ${m.soldOut ? "disabled" : ""}
          class="relative min-h-[11rem] flex flex-col items-start justify-start rounded-2xl p-4 text-left shadow bg-white active:scale-95 transition ${m.soldOut ? "opacity-40" : "hover:bg-blue-50"}">
          <div class="text-2xl font-bold leading-tight">${esc(m.name)}</div>
          <div class="mt-auto text-blue-600 text-3xl font-extrabold">${won(m.price)}</div>
          ${m.soldOut ? '<span class="absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 rounded">품절</span>' : ""}
          ${cart.get(m.id) ? `<span class="absolute top-2 right-2 bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold">${cart.get(m.id)}</span>` : ""}
        </button>`;
      $("menus").innerHTML = menus.map(tile).join("") + `
        <button data-add class="min-h-[11rem] rounded-2xl p-4 border-2 border-dashed border-slate-400 text-slate-500 hover:bg-white flex flex-col items-center justify-center">
          <span class="text-4xl leading-none">+</span><span class="text-sm mt-1">메뉴 추가하기</span>
        </button>`;
      $("editMode").textContent = editing ? "✅ 편집 끝내기" : "✏️ 메뉴 편집";
      const rows = [...cart].map(([mid, q]) => ({ m: menus.find((x) => x.id === mid), q })).filter((r) => r.m);
      $("cart").innerHTML = rows.map(({ m, q }) => `
        <li class="py-2 flex items-center gap-2">
          <div class="flex-1"><div class="font-semibold">${esc(m.name)}</div><div class="text-sm text-slate-500">${won(m.price * q)}</div></div>
          <button data-dec="${m.id}" class="w-10 h-10 rounded-full bg-slate-200 text-xl">−</button>
          <span class="w-6 text-center font-bold">${q}</span>
          <button data-inc="${m.id}" class="w-10 h-10 rounded-full bg-slate-200 text-xl">+</button>
        </li>`).join("");
      const total = rows.reduce((s, r) => s + r.m.price * r.q, 0);
      $("total").textContent = won(total);
      $("pay").disabled = rows.length === 0;
    }

    $("menus").addEventListener("click", async (e) => {
      const t = e.target.closest("button"); if (!t) return;
      if ("add" in t.dataset) { $("addBg").classList.remove("hidden"); $("mName").focus(); return; }
      if (t.dataset.id) { cart.set(t.dataset.id, (cart.get(t.dataset.id) || 0) + 1); render(); return; }
      try {
        if (t.dataset.sold) await updateDoc(doc(menusCol, t.dataset.sold), { soldOut: t.dataset.v === "true" });
        if (t.dataset.price) {
          const p = prompt("새 가격(원)", t.dataset.p);
          if (p !== null && p.trim() !== "" && Number(p) >= 0) await updateDoc(doc(menusCol, t.dataset.price), { price: Number(p) });
        }
        if (t.dataset.del && confirm(`'${t.dataset.n}' 메뉴를 삭제할까요?`)) await deleteDoc(doc(menusCol, t.dataset.del));
      } catch { toast("⚠️ 저장 실패. 네트워크를 확인하세요."); }
    });
    $("editMode").onclick = () => { editing = !editing; render(); };

    const closeAdd = () => { $("addBg").classList.add("hidden"); $("addForm").reset(); };
    $("addCancel").onclick = closeAdd;
    $("addForm").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await addDoc(menusCol, { name: $("mName").value.trim(), price: Number($("mPrice").value), soldOut: false, createdAt: Date.now() });
        toast(`➕ '${$("mName").value.trim()}' 메뉴를 추가했어요.`);
        closeAdd();
      } catch { toast("⚠️ 추가 실패. 다시 시도하세요."); }
    };
    $("cart").addEventListener("click", (e) => {
      const inc = e.target.closest("[data-inc]")?.dataset.inc, dec = e.target.closest("[data-dec]")?.dataset.dec;
      if (inc) cart.set(inc, cart.get(inc) + 1);
      if (dec) { const q = cart.get(dec) - 1; q > 0 ? cart.set(dec, q) : cart.delete(dec); }
      render();
    });
    $("clear").onclick = () => { cart.clear(); render(); };

    // ── 주문 내역 패널 ──
    const setLog = (open) => {
      $("log").classList.toggle("-translate-x-full", !open);
      $("logBg").classList.toggle("hidden", !open);
    };
    const toBottom = () => { $("logList").scrollTop = $("logList").scrollHeight; };
    $("openLog").onclick = () => { setLog(true); toBottom(); };
    $("closeLog").onclick = $("logBg").onclick = () => setLog(false);

    const expanded = new Set(); // 더보기 펼친 주문 id
    const MAX_ITEMS = 2;
    const fmtDate = (t) => new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
    let logOrders = [];
    onSnapshot(ordersCol, (snap) => {
      logOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
      renderLog();
    });
    function renderLog() {
      const q = $("logSearch").value.trim().toLowerCase();
      // 오래된 주문이 위, 최신 주문이 아래 (채팅처럼 하단 고정)
      const list = logOrders.filter((o) => !q || (o.buyer || "이름 없음").toLowerCase().includes(q)).reverse();
      $("logCount").textContent = q ? `(${list.length}/${logOrders.length}건)` : `(${logOrders.length}건)`;
      const box = $("logList");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      const keep = box.scrollTop;
      box.innerHTML = list.map((o) => {
        const open = expanded.has(o.id), more = o.items.length > MAX_ITEMS;
        const shown = open ? o.items : o.items.slice(0, MAX_ITEMS);
        const canceled = o.status === "canceled";
        return `
        <article class="rounded-xl p-3 bg-slate-700 ${canceled ? "opacity-40" : ""}">
          <div class="flex justify-between items-baseline">
            <span class="font-bold text-lg">#${o.orderNo} ${esc(o.buyer || "이름 없음")}</span>
            <span class="text-xs text-slate-300">${fmtDate(o.createdAt)}</span>
          </div>
          <ul class="mt-2 space-y-0.5">
            ${shown.map((i) => `<li class="flex justify-between"><span>${esc(i.name)}</span><b>× ${i.qty}</b></li>`).join("")}
          </ul>
          ${more ? `<button data-more="${o.id}" class="mt-1 text-sm text-orange-300 underline">${open ? "접기" : `더보기 (+${o.items.length - MAX_ITEMS})`}</button>` : ""}
          <div class="mt-2 flex justify-between items-center text-sm">
            <span class="text-slate-300">${{ pending: "조리중", done: "완료", canceled: "취소됨" }[o.status] || ""}</span>
            <b class="text-lg ${canceled ? "line-through" : ""}">${won(o.total)}</b>
          </div>
          <div class="mt-2 flex gap-2">
            ${o.status === "pending" ? `<button data-finish="${o.id}" class="flex-1 py-2 rounded-lg bg-emerald-500 text-slate-900 font-bold text-sm">요리 완성</button>` : ""}
            ${canceled ? "" : `<button data-cancel="${o.id}" class="${o.status === "pending" ? "px-4" : "flex-1"} py-2 rounded-lg bg-red-500/80 text-sm">${o.status === "pending" ? "환불" : "주문 취소 (환불)"}</button>`}
            <button data-hard="${o.id}" data-no="${o.orderNo}" class="${canceled ? "flex-1" : "px-3"} py-2 rounded-lg bg-slate-900 border border-red-400 text-red-300 text-sm" title="완전 삭제">🗑${canceled ? " 완전 삭제" : ""}</button>
          </div>
        </article>`;
      }).join("") || `<p class="text-center text-slate-400 mt-10">${q ? "검색 결과가 없어요." : "아직 주문이 없어요."}</p>`;
      // 맨 아래를 보고 있었으면 새 주문에도 계속 아래에 붙어 있고, 위로 올려 보던 중이면 그 위치 유지
      box.scrollTop = atBottom ? box.scrollHeight : keep;
    }
    $("logSearch").addEventListener("input", () => { renderLog(); toBottom(); });
    $("logList").addEventListener("click", async (e) => {
      const fid = e.target.closest("[data-finish]")?.dataset.finish;
      if (fid) {
        try { await completeOrder(id, fid); } catch { toast("⚠️ 처리 실패. 다시 시도하세요."); }
        return;
      }
      const hard = e.target.closest("[data-hard]");
      if (hard) {
        if (!confirm(`#${hard.dataset.no} 주문을 완전히 삭제할까요?\n\n기록이 영구히 사라져 복구할 수 없어요.\n(취소되지 않은 주문이면 매출에서도 빠집니다)`)) return;
        try { await deleteOrder(id, hard.dataset.hard); toast("주문을 완전히 삭제했습니다."); } catch { toast("⚠️ 삭제 실패. 다시 시도하세요."); }
        return;
      }
      const cid = e.target.closest("[data-cancel]")?.dataset.cancel;
      if (cid) {
        if (!confirm("이 주문을 취소(환불)하고 매출에서 뺄까요?")) return;
        try { await cancelOrder(id, cid); toast("주문이 취소되었습니다."); } catch { toast("⚠️ 취소 실패. 다시 시도하세요."); }
        return;
      }
      const oid = e.target.closest("[data-more]")?.dataset.more; if (!oid) return;
      expanded.has(oid) ? expanded.delete(oid) : expanded.add(oid);
      renderLog();
    });

    $("pay").onclick = async () => {
      const items = [...cart].map(([mid, qty]) => {
        const m = menus.find((x) => x.id === mid);
        return { menuId: mid, name: m.name, price: m.price, qty };
      });
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);
      const buyer = $("buyer").value.trim() || "이름 없음";
      $("pay").disabled = true;
      try {
        const orderRef = doc(ordersCol);
        let orderNo;
        await runTransaction(db,async (tx) => {
          const c = (await tx.get(classRef)).data() || {};
          const cg = (await tx.get(congestionRef(id))).data() || {};
          orderNo = (c.orderSeq || 0) + 1;
          tx.set(classRef, {
            orderSeq: orderNo,
            totalSales: (c.totalSales || 0) + total,
            orderCount: (c.orderCount || 0) + 1,
          }, { merge: true });
          tx.set(congestionRef(id), { pendingCount: (cg.pendingCount || 0) + 1, updatedAt: Date.now() }, { merge: true });
          tx.set(orderRef, { orderNo, buyer, items, total, status: "pending", createdAt: Date.now() });
        });
        cart.clear(); $("buyer").value = ""; render();
        toast(`✅ 주문번호 ${orderNo}번 접수 완료`, 4000);
      } catch (err) {
        console.error(err);
        toast("⚠️ 결제 저장 실패. 네트워크를 확인하고 다시 눌러주세요.", 5000);
        $("pay").disabled = false;
      }
    };
  </script>
</body>
</html>
